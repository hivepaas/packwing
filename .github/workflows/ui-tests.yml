name: UI tests

# The UI scenarios (crates/app/src/ui_tests): the real workspace in GPUI's test window,
# driven by clicks and typing on real files. They build everything on three systems, so
# they run daily, when started by hand (Actions > UI tests > Run workflow), and on a pull
# request that changes them, not on every push.

on:
  schedule:
    # 02:30 in Vietnam.
    - cron: "30 19 * * *"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ui-tests.yml"
      - "crates/app/src/ui_tests/**"
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to run on
        type: choice
        options: [all, linux, macos, windows]
        default: all
      filter:
        description: Only scenarios whose path starts with this (e.g. "create::")
        type: string
        default: ""

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    name: ui-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        name: >-
          ${{ fromJSON(
          (github.event_name != 'workflow_dispatch' || inputs.platforms == 'all') && '["linux-x86_64","macos-arm64","windows-x86_64"]' ||
          inputs.platforms == 'macos' && '["macos-arm64"]' ||
          inputs.platforms == 'windows' && '["windows-x86_64"]' ||
          '["linux-x86_64"]') }}
    runs-on: >-
      ${{ startsWith(matrix.name, 'macos') && 'macos-latest' ||
      startsWith(matrix.name, 'windows') && 'windows-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: "Linux packages (GPUI: Wayland, X11, Vulkan, fonts; PAM)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libvulkan-dev libdbus-1-dev libzstd-dev libpam0g-dev

      # The version and its components: rust-toolchain.toml.
      - name: Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: ui-${{ matrix.name }}

      - name: Clippy (with the UI tests)
        run: cargo clippy -p packwing --features ui-tests --all-targets -- -D warnings

      # What the system's own marks and paths do, which only these systems can tell.
      - name: Core tests
        run: cargo test --no-fail-fast -p packwing-core -p packwing-policy -p packwing-license -p packwing-cli

      # Whatever the core's tests said: both are worth seeing in one run.
      - name: UI scenarios
        if: success() || failure()
        shell: bash
        run: cargo test -p packwing --features ui-tests "ui_tests::${{ inputs.filter }}"
