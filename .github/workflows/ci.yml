name: CI

# On every pull request and push to main, on Linux: the format, the catalogs, clippy,
# every test, and the UI scenarios. The scenarios on macOS and Windows, which take
# longer to build, run daily (ui-tests.yml).
#
# The .deb is made, checked and installed after each merge (package-linux).
#
# The app itself, built to try on each system, comes out as an artifact when asked:
# by hand (Actions > CI > Run workflow), or on a pull request labelled `build`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build the app for
        type: choice
        options: [all, windows, macos, linux]
        default: all

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Linux packages (GPUI: Wayland, X11, Vulkan, fonts; PAM)"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libvulkan-dev libdbus-1-dev libzstd-dev libpam0g-dev

      # The version and its components: rust-toolchain.toml.
      - name: Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: lint

      # The format; the catalogs, en.ftl following the code and no catalog
      # having what the code no longer says; clippy, the screenshots' build
      # among them: what `make lint` runs on a computer too.
      - name: Format, catalogs and clippy
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Linux packages (GPUI: Wayland, X11, Vulkan, fonts; PAM)"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libvulkan-dev libdbus-1-dev libzstd-dev libpam0g-dev

      - name: Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Tests
        run: make test

      # Whatever the tests said: both are worth seeing in one run.
      - name: UI scenarios
        if: success() || failure()
        run: make test-ui

  # What crates/mobile builds for Android alone (its `Document`, behind
  # #[cfg(target_os = "android")]) is compiled by no other job: every one of
  # them builds for this computer, where that cfg leaves it out. The app
  # itself is built by hand, on a computer with the SDK (make android).
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      # For the C the archive libraries bring: cargo-ndk points it at the NDK
      # the runner has, as scripts/build_android.sh does on a computer.
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      # Checked, not linted: clippy turned on `-D warnings` for this target
      # fails on packwing-core over a lint that is wrong about code that
      # already does what it asks (missing_const_for_thread_local).
      - name: The mobile crate, for Android
        run: cargo ndk -t arm64-v8a -P 29 check --locked -p packwing-mobile

  build:
    name: build-${{ matrix.name }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build'))
    strategy:
      fail-fast: false
      matrix:
        name: >-
          ${{ fromJSON(
          (github.event_name != 'workflow_dispatch' || inputs.platforms == 'all') && '["linux-x86_64","macos-arm64","windows-x86_64"]' ||
          inputs.platforms == 'windows' && '["windows-x86_64"]' ||
          inputs.platforms == 'macos' && '["macos-arm64"]' ||
          '["linux-x86_64"]') }}
    runs-on: >-
      ${{ startsWith(matrix.name, 'macos') && 'macos-latest' ||
      startsWith(matrix.name, 'windows') && 'windows-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: "Linux packages (GPUI: Wayland, X11, Vulkan, fonts; PAM)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libvulkan-dev libdbus-1-dev libzstd-dev libpam0g-dev

      - name: Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.name }}

      - name: Build
        run: cargo build --release --locked -p packwing -p packwing-cli

      - uses: actions/upload-artifact@v4
        with:
          name: packwing-${{ matrix.name }}
          path: |
            target/release/packwing${{ startsWith(matrix.name, 'windows') && '.exe' || '' }}
            target/release/pkw${{ startsWith(matrix.name, 'windows') && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 14

  # The .deb, the .rpm and pkw alone, made as a release's are and checked:
  # what each holds, then the packages installed (the .rpm in Fedora) and pkw
  # run from each (scripts/check_linux_package.sh). After each merge, and when
  # the app is built on demand.
  package-linux:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Linux packages (GPUI: Wayland, X11, Vulkan, fonts; PAM)"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libvulkan-dev libdbus-1-dev libzstd-dev libpam0g-dev rpm cpio

      - name: Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: package-linux

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3

      - name: Build
        run: cargo build --release --locked -p packwing -p packwing-cli

      - name: Package
        run: scripts/package_linux.sh

      - name: Check, install and run
        run: |
          scripts/check_linux_package.sh --install dist/packwing_*_amd64.deb
          scripts/check_linux_package.sh --install dist/packwing_*_x86_64.rpm
          scripts/check_linux_package.sh dist/pkw_*_linux_x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: packwing-linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
