name: CI

# On every pull request and push to main, on Linux: the format, the catalogs, clippy,
# every test, and the UI scenarios. The scenarios on macOS and Windows, which take
# longer to build, run daily (ui-tests.yml).
#
# The app itself, built to try on each system, comes out as an artifact when asked:
# by hand (Actions > CI > Run workflow), or on a pull request labelled `build`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build the app for
        type: choice
        options: [all, windows, macos, linux]
        default: all

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Linux packages (GPUI: Wayland, X11, Vulkan, fonts; PAM)"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libvulkan-dev libdbus-1-dev libzstd-dev libpam0g-dev

      # The version and its components: rust-toolchain.toml.
      - name: Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: lint

      # en.ftl follows the code, and no catalog has what the code no longer says.
      - name: Catalogs
        run: python3 scripts/i18n.py check

      - name: Format and clippy
        run: make lint

      # The screenshots' build, which only Linux has (make test-window).
      - name: Clippy (with the screenshots)
        run: cargo clippy -p packwing --no-default-features --features wayland,shots --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Linux packages (GPUI: Wayland, X11, Vulkan, fonts; PAM)"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libvulkan-dev libdbus-1-dev libzstd-dev libpam0g-dev

      - name: Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Tests
        run: make test

      # Whatever the tests said: both are worth seeing in one run.
      - name: UI scenarios
        if: success() || failure()
        run: make test-ui

  build:
    name: build-${{ matrix.name }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build'))
    strategy:
      fail-fast: false
      matrix:
        name: >-
          ${{ fromJSON(
          (github.event_name != 'workflow_dispatch' || inputs.platforms == 'all') && '["linux-x86_64","macos-arm64","windows-x86_64"]' ||
          inputs.platforms == 'windows' && '["windows-x86_64"]' ||
          inputs.platforms == 'macos' && '["macos-arm64"]' ||
          '["linux-x86_64"]') }}
    runs-on: >-
      ${{ startsWith(matrix.name, 'macos') && 'macos-latest' ||
      startsWith(matrix.name, 'windows') && 'windows-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: "Linux packages (GPUI: Wayland, X11, Vulkan, fonts; PAM)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libvulkan-dev libdbus-1-dev libzstd-dev libpam0g-dev

      - name: Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.name }}

      - name: Build
        run: cargo build --release --locked -p packwing

      - uses: actions/upload-artifact@v4
        with:
          name: packwing-${{ matrix.name }}
          path: target/release/packwing${{ startsWith(matrix.name, 'windows') && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 14
