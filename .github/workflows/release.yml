name: Release

# A tag vX.Y.Z (or vX.Y.Z-betaN) builds packwing for every platform, packages
# it (scripts/package_*.sh) and makes a draft release on GitHub with the files
# and their SHA-256. Nothing reaches users until the draft is published and the
# signed list of releases moves (docs/releasing.md).
#
# A pull request that changes the packaging, or a run by hand (Actions >
# Release > Run workflow), builds and packages the branch the same way and
# keeps the files as the run's artifacts: a rehearsal, with no release.
#
# The Mac App Store's package is built beside them (job app-store), and a tag
# sends it to App Store Connect, for TestFlight and review; a run by hand sends
# it when asked to.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-beta[0-9]+']
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - packaging/**
      - scripts/package_*.sh
      - scripts/check_linux_package.sh
      - scripts/check_windows_installer.ps1
  workflow_dispatch:
    inputs:
      app_store_upload:
        description: Send the Mac App Store's package to App Store Connect
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # The tag is the workspace's version, or the release would tell its users
      # of an update to itself.
      - name: The tag and Cargo.toml agree
        id: v
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    name: ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux on the oldest Ubuntu GitHub has: the glibc it links is the
          # oldest the .deb runs on (2.35: Ubuntu 22.04, Debian 12).
          - { name: linux-x86_64, runner: ubuntu-22.04 }
          - { name: linux-aarch64, runner: ubuntu-22.04-arm }
          - { name: macos-aarch64, runner: macos-15 }
          - { name: macos-x86_64, runner: macos-15-intel }
          - { name: windows-x86_64, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    env:
      # The oldest macOS packwing runs on, as packaging/macos/Info.plist says.
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      # Whether the repository holds a Developer ID (not the secret itself).
      MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: 'Linux packages (GPUI: Wayland, X11, Vulkan, fonts; PAM)'
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libvulkan-dev libdbus-1-dev libzstd-dev libpam0g-dev dpkg-dev rpm cpio

      - name: NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }

      # The version and its components: rust-toolchain.toml.
      - name: Rust
        run: rustup toolchain install

      # The third-party licenses every package holds.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3

      # Where install-action has no build of it (Intel Macs), its fallback
      # builds it from source without the `cli` feature, which is the program.
      - name: cargo-about, from source where it has no build
        shell: bash
        run: cargo about --version 2>/dev/null || cargo install cargo-about@0.9.3 --locked --features cli

      - name: Build
        run: cargo build --release --locked -p packwing -p packwing-cli

      # A Developer ID for macOS, when the repository has one (docs/releasing.md):
      # a keychain of this run's own, and the notary's key in a file the
      # packaging script is told of. Without it, signed ad hoc, with no Finder
      # extension.
      - name: Signing keys (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # Apple's intermediate, should the runner lack it: the chain must build.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || true
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)"
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE holds no valid Developer ID Application identity"
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY" ]; then
            printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/notary.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          fi

      - name: Package
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/package_${{ runner.os == 'macOS' && 'macos' || runner.os == 'Windows' && 'windows' || 'linux' }}.sh

      - name: Forget the signing keys (macOS)
        if: always() && runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"

      # What each holds, then the .deb installed here, the .rpm in Fedora, and
      # pkw run from each and from its own tar.gz.
      - name: Check, install and run (Linux)
        if: runner.os == 'Linux'
        run: |
          scripts/check_linux_package.sh --install dist/packwing_*.deb
          scripts/check_linux_package.sh --install dist/packwing_*.rpm
          scripts/check_linux_package.sh dist/pkw_*.tar.gz

      # The installer, quiet: for the user and for everyone, again as the
      # updater runs it, and uninstalled.
      - name: Install and uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/check_windows_installer.ps1 (Get-Item dist/packwing_*-setup.exe).FullName

      - uses: actions/upload-artifact@v4
        with:
          name: packwing-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # The Mac App Store's Packwing.app, for Apple silicon and Intel, in the
  # sandbox, in an installer package (scripts/package_macos_appstore.sh): signed
  # when the repository has the store's certificates and profile, and sent to
  # App Store Connect for a tag. Not part of the GitHub release.
  app-store:
    name: macos-app-store
    needs: version
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      # Whether the repository holds the store's certificates (not the secrets).
      MAS_SIGNING: ${{ secrets.MAS_APP_CERTIFICATE != '' }}
      UPLOAD: ${{ (github.ref_type == 'tag' || inputs.app_store_upload) && '1' || '' }}
    steps:
      # Every commit, for the build number: their count, which grows with main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rust, for both Macs
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3

      # The store's two certificates (the app's and the installer's) in a
      # keychain of this run's own, its profile, and the API key that uploads.
      - name: Signing keys
        if: env.MAS_SIGNING == 'true'
        env:
          MAS_APP_CERTIFICATE: ${{ secrets.MAS_APP_CERTIFICATE }}
          MAS_INSTALLER_CERTIFICATE: ${{ secrets.MAS_INSTALLER_CERTIFICATE }}
          MAS_CERTIFICATE_PASSWORD: ${{ secrets.MAS_CERTIFICATE_PASSWORD }}
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          keychain="$RUNNER_TEMP/app-store.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # Apple's intermediate, should the runner lack it: the chain must build.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$keychain" || true
          for cert in MAS_APP_CERTIFICATE MAS_INSTALLER_CERTIFICATE; do
            printf '%s' "${!cert}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MAS_CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild
          done
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identities="$(security find-identity -v "$keychain")"
          app="$(sed -n 's/.*"\(Apple Distribution: .*\)"/\1/p' <<<"$identities" | head -n 1)"
          installer="$(sed -n 's/.*"\(3rd Party Mac Developer Installer: .*\)"/\1/p' <<<"$identities" | head -n 1)"
          if [ -z "$app" ] || [ -z "$installer" ]; then
            echo "::error::MAS_APP_CERTIFICATE and MAS_INSTALLER_CERTIFICATE need an Apple Distribution and a 3rd Party Mac Developer Installer identity"
            exit 1
          fi
          printf '%s' "$MAS_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/app-store.provisionprofile"
          {
            echo "MAS_APP_IDENTITY=$app"
            echo "MAS_INSTALLER_IDENTITY=$installer"
            echo "MAS_KEYCHAIN=$keychain"
            echo "MAS_PROFILE=$RUNNER_TEMP/app-store.provisionprofile"
          } >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY" ]; then
            printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/app-store.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/app-store.p8" >> "$GITHUB_ENV"
          fi

      - name: Package
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -n "$UPLOAD" ] && [ "$MAS_SIGNING" != true ]; then
            echo "::error::sending to App Store Connect needs the store's certificates (docs/releasing.md)"
            exit 1
          fi
          scripts/package_macos_appstore.sh

      - name: Forget the signing keys
        if: always() && env.MAS_SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/app-store.keychain-db" || true
          rm -f "$RUNNER_TEMP/app-store.p8" "$RUNNER_TEMP/app-store.provisionprofile"

      - uses: actions/upload-artifact@v4
        with:
          name: packwing-macos-app-store
          path: dist/*.pkg
          if-no-files-found: error
          retention-days: 30

  release:
    name: Draft release
    needs: [version, package]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: SHA-256
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # The release's notes are docs/releases/vX.Y.Z.md; a draft, published by
      # hand once it is checked.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes="docs/releases/$TAG.md"
          [ -f "$notes" ] || { echo "::error::no $notes"; exit 1; }
          prerelease=()
          case "$TAG" in *-beta*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" dist/* --draft "${prerelease[@]}" \
            --title "packwing $VERSION" --notes-file "$notes" --verify-tag
