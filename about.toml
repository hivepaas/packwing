# The licenses packwing's crates may be under, for `cargo about`
# (scripts/package_linux.sh writes the program's third-party licenses with
# it). A crate under any other stops the package until it is looked at.
# For a crate under several, the first of these is the one listed.
accepted = [
    "MIT",
    "Apache-2.0",
    # Apache-2.0 with an exception that only loosens it: cap-std's winx, on
    # Windows, through hivepack's extract.
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    # hivepack's ports of libbzip2 and liblzma keep their licenses.
    "bzip2-1.0.6",
    "0BSD",
    # The root certificates of webpki-root-certs, through OpenDAL's HTTP client.
    "CDLA-Permissive-2.0",
]
# Only what is built into the program: not what builds it.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# packwing's crates are not published: they are listed. packwing's own, the only crates under the GPL,
# the template leaves out.
private = { ignore = false }

[packwing]
accepted = ["GPL-3.0-or-later"]

[packwing-audit]
accepted = ["GPL-3.0-or-later"]

[packwing-cli]
accepted = ["GPL-3.0-or-later"]

[packwing-core]
accepted = ["GPL-3.0-or-later"]

[packwing-i18n]
accepted = ["GPL-3.0-or-later"]

[packwing-license]
accepted = ["GPL-3.0-or-later"]

[packwing-mobile]
accepted = ["GPL-3.0-or-later"]

[packwing-policy]
accepted = ["GPL-3.0-or-later"]

[packwing-remote]
accepted = ["GPL-3.0-or-later"]

[packwing-sandbox]
accepted = ["GPL-3.0-or-later"]

[packwing-store]
accepted = ["GPL-3.0-or-later"]

[packwing-update]
accepted = ["GPL-3.0-or-later"]

[shellwing-ssh]
accepted = ["GPL-3.0-or-later"]

[shellwing-spawn]
accepted = ["GPL-3.0-or-later"]

# hivepack's notices, whole: its own code's, and what each module is a port
# of with its copyright lines, which cargo-about leaves out of a text it
# recognizes (its LICENSE.md lists them). The modules open, sevenz and sign
# hold the crate's own MIT text again, which LICENSE gives. Each file is
# pinned to the release packwing builds with: a notice that changes stops the
# package until it is looked at again.
#
# UnRAR is accepted for this crate alone, for its rar module: see
# GPL-ADDITIONAL-PERMISSION.md.
[hivepack]
accepted = ["UnRAR"]

[hivepack.clarify]
license = "MIT AND BSD-2-Clause AND BSD-3-Clause AND Zlib AND 0BSD AND bzip2-1.0.6 AND Unicode-3.0 AND UnRAR"

