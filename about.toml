# The licenses packwing's crates may be under, for `cargo about`
# (scripts/package_linux.sh writes the program's third-party licenses with
# it). A crate under any other stops the package until it is looked at.
# For a crate under several, the first of these is the one listed.
accepted = [
    "MIT",
    "Apache-2.0",
    # Apache-2.0 with an exception that only loosens it: cap-std's winx, on
    # Windows, through hivepack-extract.
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    # hivepack's ports of libbzip2 and liblzma keep their licenses.
    "bzip2-1.0.6",
    "0BSD",
]
# Only what is built into the program: not what builds it.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# hivepack's crates are not on crates.io (`publish = false`), as packwing's
# are not: they are listed. packwing's own, the only crates under the GPL,
# the template leaves out.
private = { ignore = false }

[packwing]
accepted = ["GPL-3.0-or-later"]

[packwing-core]
accepted = ["GPL-3.0-or-later"]

# hivepack's notices, whole: what each crate is a port of, and the
# copyright lines, which cargo-about leaves out of a text it recognizes.
# Each file is pinned to the commit packwing builds with: a notice that
# changes stops the package until it is looked at again.

