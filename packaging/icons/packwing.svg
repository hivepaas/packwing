<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- packwing's app icon: the window's logo, a zipper whose pull is a
       feather, on the accent's green tile; in color here, with the teeth
       in the soft tint, the slider white and the feather amber. -->
