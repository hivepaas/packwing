# The iOS app's Xcode project, made by XcodeGen (`make ios`): edit this, not
# the .xcodeproj, which is generated and not committed.
name: Packwing
options:
  bundleIdPrefix: com.hivepaas
  deploymentTarget:
    # BGContinuedProcessingTask: a long job goes on once the app is left.
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 6KW3D6ZGQJ
    CODE_SIGN_STYLE: Automatic
targets:
  Packwing:
    type: application
    platform: iOS
    sources:
      - path: Packwing
      # Generated by scripts/build_ios.sh, from crates/mobile.
      - path: Generated/packwing_mobile.swift
      # The desktop's typeface: Nunito, which has every Vietnamese letter.
      - path: ../crates/app/assets/fonts
        buildPhase: resources
        type: folder
    dependencies:
      - framework: Generated/PackwingCore.xcframework
        embed: false
    info:
      path: Packwing/Info.plist
      properties:
        CFBundleDisplayName: packwing
        # The languages of crates/i18n: iOS offers them in the app's settings.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de, es, fr, id, it, ja, ko, pt-BR, ru, tr, uk, vi, zh-Hans, zh-Hant]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - fonts/Nunito-Regular.ttf
          - fonts/Nunito-Medium.ttf
          - fonts/Nunito-SemiBold.ttf
          - fonts/Nunito-Bold.ttf
        # Its own folder shows in Files, as On My iPhone › packwing; an
        # archive opened from Files or another app is read where it is.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.zip-archive
              - org.7-zip.7-zip-archive
              - com.rarlab.rar-archive
              - public.tar-archive
              - org.gnu.gnu-zip-archive
              - org.gnu.gnu-zip-tar-archive
              - public.bzip2-archive
              - org.tukaani.xz-archive
              - org.tukaani.tar-xz-archive
              - com.facebook.zstandard-archive
              - public.cpio-archive
              - public.iso-image
              - public.archive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hivepaas.packwing
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The Rust library is built for Apple silicon's Simulator only.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        # What the Rust library needs from the system.
        OTHER_LDFLAGS: ["-lc++", "-lz", "-liconv", "-framework", "Security", "-framework", "SystemConfiguration"]
