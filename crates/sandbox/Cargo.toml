[package]
name = "packwing-sandbox"
description = "The App Sandbox the Mac App Store's packwing runs in: asking for a folder, and keeping it; and its Services, Finder's right-click menu there"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# What a folder's prompt answers, to the window's thread.
futures-channel = "0.3"

# The open panel, security-scoped bookmarks, and what the sandbox lets through.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSEnumerator", "NSError", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSApplication", "NSOpenPanel", "NSPanel", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSSavePanel", "NSWindow"] }

[dev-dependencies]
tempfile = "3"

# As the workspace's, but that src/macos.rs may call AppKit and the C library.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
dbg_macro = "deny"
