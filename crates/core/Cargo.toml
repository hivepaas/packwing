[package]
name = "packwing-core"
description = "What packwing does with archives, through hivepack, without its window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Its messages, in the user's language.
packwing-i18n.workspace = true
# The random bytes of WinZip AES and 7z's AES, on every system.
getrandom = "0.4"
hivepack-7z.workspace = true
hivepack-age.workspace = true
hivepack-bzip2.workspace = true
hivepack-cpio.workspace = true
hivepack-deflate.workspace = true
# With RAR, under UnRAR's license: see GPL-ADDITIONAL-PERMISSION.md.
hivepack-extract = { workspace = true, features = ["rar"] }
hivepack-iso.workspace = true
# `.lz4` files and `.tar.lz4` archives, and its `unsafe-fast`, which hivepack-open
# and hivepack-extract use too.
hivepack-lz4.workspace = true
hivepack-open.workspace = true
hivepack-rar.workspace = true
hivepack-tar.workspace = true
hivepack-udf.workspace = true
hivepack-xar.workspace = true
hivepack-xz.workspace = true
hivepack-zip.workspace = true
hivepack-zstd.workspace = true
# Moving files to the system's Trash, when a storage on this computer deletes them.
trash = "5"
# The size of a picture, before it is decoded to show it.
imagesize = "0.14"
# Finding `bao cao` in `Báo cáo`, whichever way its accents are written.
unicode-normalization = "0.1"
fs4 = "1.1.0"

[dev-dependencies]
# Encrypted ZIP archives, written by the tests.
hivepack-zip.workspace = true

[lints]
workspace = true
