[package]
name = "packwing-core"
description = "What packwing does with archives, through hivepack, without its window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Its messages, in the user's language.
packwing-i18n.workspace = true
# What an organization has fixed.
packwing-policy.workspace = true
# The random bytes of WinZip AES and 7z's AES, on every system.
getrandom = "0.4"
# Every format, RAR among them: see GPL-ADDITIONAL-PERMISSION.md. Files
# signed with SSH and hybrid keys too.
hivepack.workspace = true
# Moving files to the system's Trash, when a storage on this computer deletes them.
trash = "5"
# The size of a picture, before it is decoded to show it.
imagesize = "0.14"
# Finding `bao cao` in `Báo cáo`, whichever way its accents are written.
unicode-normalization = "0.1"
fs4 = "1.1.0"
# How much memory is available, for how many threads a job may take.
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
# A file's checksums, as the tools that make them write them.
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
md-5 = { version = "0.11", default-features = false }
blake3 = "1.8"

# Quarantine on what is copied here from elsewhere.
# The limits a job object and ulimit put on memory (memory_limits.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1"

# As the workspace's, but that src/memory_limits.rs may ask the system for its
# limits on memory, which no crate reads.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
dbg_macro = "deny"
