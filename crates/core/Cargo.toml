[package]
name = "packwing-core"
description = "What packwing does with archives, through hivepack, without its window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Its messages, in the user's language.
packwing-i18n.workspace = true
# What an organization has fixed.
packwing-policy.workspace = true
# What packwing did, kept when asked (docs/audit.md).
packwing-audit.workspace = true
serde_json = "1"
# The random bytes of WinZip AES and 7z's AES, on every system.
getrandom = "0.4"
# Every format, RAR among them: see GPL-ADDITIONAL-PERMISSION.md. Files
# signed with SSH and hybrid keys too.
hivepack.workspace = true
# The size of a picture, before it is decoded to show it.
imagesize = "0.14"
# Finding `bao cao` in `Báo cáo`, whichever way its accents are written.
unicode-normalization = "0.1"
fs4 = "1.1.0"
# A file's checksums, as the tools that make them write them.
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
md-5 = { version = "0.11", default-features = false }
blake3 = "1.8"

# Moving files to the system's Trash, when a storage on this computer deletes
# them. Phones have none that an app moves files to: there they are deleted.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
trash = "5"

# Quarantine on what is copied here from elsewhere, on macOS; a file's extended
# attributes and ACLs in a tar archive kept for a backup, on Unix.
[target.'cfg(unix)'.dependencies]
xattr = "1"
# The names of a file's owner and group, in a tar archive kept for a backup.
nix = { version = "0.31", default-features = false, features = ["user"] }

[lints]
workspace = true
