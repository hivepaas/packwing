[package]
name = "packwing-license"
description = "What a license key says, checked with no server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
# Ed25519 with a context, which ed25519-dalek does not offer (src/verify.rs).
curve25519-dalek = { version = "5", default-features = false, features = ["precomputed-tables"] }
ml-dsa = { version = "0.1", default-features = false, features = ["alloc"] }
packwing-i18n.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
time = { version = "0.3", default-features = false, features = ["macros", "parsing", "std"] }

[build-dependencies]
serde_json = "1"
time = { version = "0.3", default-features = false, features = ["std"] }

[lints]
workspace = true
