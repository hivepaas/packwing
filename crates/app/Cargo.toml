[package]
name = "packwing"
description = "File archiver that opens archives safely"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "packwing"
path = "src/main.rs"

[features]
default = ["wayland", "x11"]
# Linux window system backends. Build with `--no-default-features --features wayland`
# when the X11 development libraries are not installed.
wayland = ["gpui_platform/wayland"]
x11 = ["gpui_platform/x11"]
# Draws every screen to a PNG, light and dark, without a display (src/shots.rs,
# Linux only): `cargo test -p packwing --features shots shots`.
shots = ["gpui_platform/test-support", "dep:gpui_wgpu", "dep:image"]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
unicode-segmentation = "1"

# The screenshots' text system and PNG writer; `image` is the version GPUI uses.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.9", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[lints]
workspace = true
