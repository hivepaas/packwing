[package]
name = "packwing"
description = "File archiver that opens archives safely"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "packwing_app"
path = "src/lib.rs"

[[bin]]
name = "packwing"
path = "src/main.rs"

[features]
default = ["wayland", "x11"]
# Linux window system backends. Build with `--no-default-features --features wayland`
# when the X11 development libraries are not installed.
wayland = ["gpui_platform/wayland"]
x11 = ["gpui_platform/x11"]
# Draws every screen to a PNG, light and dark, without a display (src/shots.rs,
# Linux only): `cargo test -p packwing --features shots shots`.
shots = ["gpui_platform/test-support", "dep:gpui_wgpu", "dep:image", "test-hooks"]
# The UI scenarios (src/ui_tests): the real window, driven as a user does, with no
# display. `make test-ui`; on CI on Linux for every pull request (.github/workflows/ci.yml),
# and by hand and daily on all three systems (.github/workflows/ui-tests.yml).
ui-tests = ["gpui/test-support", "test-hooks"]
# What the tests above look in through.
test-hooks = ["packwing-update/test-source"]

[dependencies]
# Where this system keeps the home, Desktop and Downloads folders.
dirs = "5"
gpui.workspace = true
gpui_platform.workspace = true
# Reading, extracting and testing archives, through hivepack.
packwing-core.workspace = true
# What a license key says.
packwing-license.workspace = true
# What an organization has fixed.
packwing-policy.workspace = true
# Storages across the network: S3, WebDAV and SFTP.
packwing-remote.workspace = true
# Telling that a newer packwing is out, and installing it.
packwing-update.workspace = true
# The interface's words, in the user's language.
packwing-i18n.workspace = true
# The system's right-click menu: packwing's items in it (src/right_click.rs).
# 0.2.1 says which package serves the menu on Windows (src/right_click.rs).
context-menu = "0.2.1"
# What a job on a thread of its own hands back to the window.
futures-channel = "0.3"
# The date a license ends.
time = { version = "0.3", default-features = false, features = ["std"] }
unicode-segmentation = "1"

# Asking that it is the user, for a storage that asks it (src/confirm.rs).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
robius-authentication = "0.3"

# The screenshots' text system and PNG writer; `image` is the version GPUI uses.
# PAM, to check the login password, without bindgen or the system's headers.
[target.'cfg(target_os = "linux")'.dependencies]
nonstick = "0.1"
nix = { version = "0.31", default-features = false, features = ["user"] }
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.9", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

# The system's UI font size (src/text_size.rs).
[target.'cfg(windows)'.dependencies]
winreg = "0.56"

# The icon and the version in packwing.exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[lints]
workspace = true
