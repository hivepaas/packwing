[package]
name = "packwing-cli"
description = "packwing on the command line: open, extract, check and make archives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# `pkw`: a program of its own, as packwing.exe is a window's on Windows and
# has no console to write to. It takes in no window system: it runs where
# there is no screen, over SSH and in CI.
[[bin]]
name = "pkw"
path = "src/main.rs"

[dependencies]
packwing-core.workspace = true
packwing-i18n.workspace = true
packwing-policy.workspace = true
# Whether the license has the audit log, for the user to keep one.
packwing-license.workspace = true
# The storages added to the app: S3, SFTP and WebDAV (the `remote` feature).
packwing-remote = { workspace = true, optional = true }
clap = { version = "4.5", features = ["derive", "wrap_help", "string"] }
# `pkw completions SHELL`, and the manual pages the packages hold.
clap_complete = "4.5"
clap_mangen = "0.2"
# A password typed with nothing shown.
rpassword = "7"
# Ctrl-C and SIGTERM stop a job, and remove what it was making.
ctrlc = { version = "3.5", features = ["termination"] }
serde_json = "1"

[features]
default = ["remote"]
# S3, SFTP and WebDAV storages, by NAME:PATH. Without it pkw is a third of
# the size, and opens archives here and in the app's folder storages alone:
#   cargo build --release -p packwing-cli --no-default-features
remote = ["dep:packwing-remote"]

# A test puts itself and pkw in a job object of little memory (tests/memory_job.rs).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

# As the workspace's, but that tests/memory_job.rs may make that job object.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
dbg_macro = "deny"
