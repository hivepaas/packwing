[package]
name = "packwing-audit"
description = "packwing's audit log: what it did, one JSON line a record, each chained to the one before"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
# A session's id, so that two runs' records are told apart.
getrandom = "0.4"

# The computer's name and the user's number; journald, and a record too
# long for a datagram in a sealed memory file.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["system", "process", "fs", "net"] }

# The user's SID, and the Event Log.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_EventLog", "Win32_System_Threading"] }

[dev-dependencies]

# As the workspace's, but that src/windows.rs may call the Event Log and the
# process's token, which no crate it has wraps.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
dbg_macro = "deny"
