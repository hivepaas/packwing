[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The latest stable Rust: packwing follows it rather than keeping old ones working.
rust-version = "1.99"
repository = "https://github.com/hivepaas/packwing"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# GPUI as published by Longbridge, the same snapshot shellwing uses.
gpui = { package = "gpui-pre", version = "=0.3.9" }
# font-kit and runtime_shaders only affect macOS; the Linux backends are app features.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["font-kit", "runtime_shaders"] }

# hivepack, packwing's archive library: not on crates.io yet, so from its
# repository at one commit. Every crate comes from the same one.
hivepack-7z = { git = "https://github.com/hivepaas/hivepack-rs", rev = "83b535c4c1b2560b39f0aa4a4f10e2fac53d512d" }
hivepack-age = { git = "https://github.com/hivepaas/hivepack-rs", rev = "83b535c4c1b2560b39f0aa4a4f10e2fac53d512d" }
hivepack-cpio = { git = "https://github.com/hivepaas/hivepack-rs", rev = "83b535c4c1b2560b39f0aa4a4f10e2fac53d512d" }
hivepack-deflate = { git = "https://github.com/hivepaas/hivepack-rs", rev = "83b535c4c1b2560b39f0aa4a4f10e2fac53d512d" }
hivepack-extract = { git = "https://github.com/hivepaas/hivepack-rs", rev = "83b535c4c1b2560b39f0aa4a4f10e2fac53d512d" }
hivepack-iso = { git = "https://github.com/hivepaas/hivepack-rs", rev = "83b535c4c1b2560b39f0aa4a4f10e2fac53d512d" }
hivepack-open = { git = "https://github.com/hivepaas/hivepack-rs", rev = "83b535c4c1b2560b39f0aa4a4f10e2fac53d512d" }
hivepack-rar = { git = "https://github.com/hivepaas/hivepack-rs", rev = "83b535c4c1b2560b39f0aa4a4f10e2fac53d512d" }
hivepack-tar = { git = "https://github.com/hivepaas/hivepack-rs", rev = "83b535c4c1b2560b39f0aa4a4f10e2fac53d512d" }
hivepack-udf = { git = "https://github.com/hivepaas/hivepack-rs", rev = "83b535c4c1b2560b39f0aa4a4f10e2fac53d512d" }
hivepack-xar = { git = "https://github.com/hivepaas/hivepack-rs", rev = "83b535c4c1b2560b39f0aa4a4f10e2fac53d512d" }
hivepack-xz = { git = "https://github.com/hivepaas/hivepack-rs", rev = "83b535c4c1b2560b39f0aa4a4f10e2fac53d512d" }
hivepack-zip = { git = "https://github.com/hivepaas/hivepack-rs", rev = "83b535c4c1b2560b39f0aa4a4f10e2fac53d512d" }
hivepack-zstd = { git = "https://github.com/hivepaas/hivepack-rs", rev = "83b535c4c1b2560b39f0aa4a4f10e2fac53d512d" }
packwing-core = { path = "crates/core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Dependencies optimised in dev builds too, so the UI is smooth while developing.
[profile.dev.package."*"]
opt-level = 2
