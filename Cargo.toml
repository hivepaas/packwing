[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The latest stable Rust: packwing follows it rather than keeping old ones working.
rust-version = "1.99"
repository = "https://github.com/hivepaas/packwing"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# GPUI as published by Longbridge, the same snapshot shellwing uses.
gpui = { package = "gpui-pre", version = "=0.3.9" }
# font-kit and runtime_shaders only affect macOS; the Linux backends are app features.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["font-kit", "runtime_shaders"] }

# hivepack, packwing's archive library: not on crates.io yet, so from its
# repository at one commit. Every crate comes from the same one.
#
# With `unsafe-fast` where a crate has it, which hivepack leaves off by default:
# the processor's CRC-32 instructions, and the unchecked fast loops of zstd and
# LZ4. What each does is in hivepack's docs/unsafe.md.
hivepack-7z = { git = "https://github.com/hivepaas/hivepack-rs", rev = "8d2aea5a583ccade520efec999584c4a3f1d84d2", features = ["unsafe-fast"] }
hivepack-age = { git = "https://github.com/hivepaas/hivepack-rs", rev = "8d2aea5a583ccade520efec999584c4a3f1d84d2" }
hivepack-bzip2 = { git = "https://github.com/hivepaas/hivepack-rs", rev = "8d2aea5a583ccade520efec999584c4a3f1d84d2" }
hivepack-cpio = { git = "https://github.com/hivepaas/hivepack-rs", rev = "8d2aea5a583ccade520efec999584c4a3f1d84d2" }
hivepack-deflate = { git = "https://github.com/hivepaas/hivepack-rs", rev = "8d2aea5a583ccade520efec999584c4a3f1d84d2", features = ["unsafe-fast"] }
hivepack-extract = { git = "https://github.com/hivepaas/hivepack-rs", rev = "8d2aea5a583ccade520efec999584c4a3f1d84d2" }
hivepack-iso = { git = "https://github.com/hivepaas/hivepack-rs", rev = "8d2aea5a583ccade520efec999584c4a3f1d84d2" }
hivepack-lz4 = { git = "https://github.com/hivepaas/hivepack-rs", rev = "8d2aea5a583ccade520efec999584c4a3f1d84d2", features = ["unsafe-fast"] }
hivepack-open = { git = "https://github.com/hivepaas/hivepack-rs", rev = "8d2aea5a583ccade520efec999584c4a3f1d84d2" }
hivepack-rar = { git = "https://github.com/hivepaas/hivepack-rs", rev = "8d2aea5a583ccade520efec999584c4a3f1d84d2" }
hivepack-sign = { git = "https://github.com/hivepaas/hivepack-rs", rev = "8d2aea5a583ccade520efec999584c4a3f1d84d2" }
hivepack-tar = { git = "https://github.com/hivepaas/hivepack-rs", rev = "8d2aea5a583ccade520efec999584c4a3f1d84d2" }
hivepack-udf = { git = "https://github.com/hivepaas/hivepack-rs", rev = "8d2aea5a583ccade520efec999584c4a3f1d84d2" }
hivepack-xar = { git = "https://github.com/hivepaas/hivepack-rs", rev = "8d2aea5a583ccade520efec999584c4a3f1d84d2" }
hivepack-xz = { git = "https://github.com/hivepaas/hivepack-rs", rev = "8d2aea5a583ccade520efec999584c4a3f1d84d2" }
hivepack-zip = { git = "https://github.com/hivepaas/hivepack-rs", rev = "8d2aea5a583ccade520efec999584c4a3f1d84d2", features = ["unsafe-fast"] }
hivepack-zstd = { git = "https://github.com/hivepaas/hivepack-rs", rev = "8d2aea5a583ccade520efec999584c4a3f1d84d2", features = ["unsafe-fast"] }
packwing-core = { path = "crates/core" }
packwing-remote = { path = "crates/remote" }
packwing-i18n = { path = "crates/i18n" }
packwing-license = { path = "crates/license" }
packwing-policy = { path = "crates/policy" }
packwing-update = { path = "crates/update" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Dependencies optimised in dev builds too, so the UI is smooth while developing.
[profile.dev.package."*"]
opt-level = 2
