[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The latest stable Rust: packwing follows it rather than keeping old ones working.
rust-version = "1.99"
repository = "https://github.com/hivepaas/packwing"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# GPUI as published by Longbridge, the same snapshot shellwing uses.
gpui = { package = "gpui-pre", version = "=0.3.9" }
# font-kit and runtime_shaders only affect macOS; the Linux backends are app features.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["font-kit", "runtime_shaders"] }

# hivepack, packwing's archive library: one crate, a module for each format.
# 0.2 has sevenz's Writer::set_method; 0.2.1 tells .tlz, tar.lzma's short name;
# 0.3 goes on from damaged data (Options::on_damaged), and extracts into a Sink.
#
# With `rar`, under UnRAR's license (GPL-ADDITIONAL-PERMISSION.md), and with
# `unsafe-fast`, which hivepack leaves off by default: the processor's CRC-32
# instructions, and the unchecked fast loops of zstd, LZ4 and Deflate. What
# each does is in hivepack's docs/unsafe.md. With `memory` (0.8): how much
# memory packwing may still take, for its jobs' threads; it asks the system
# through `unsafe` code on Windows and macOS. 0.9 creates links that lead
# outside the folder (Links::Any), and asks about them (on_links_outside).
# 0.10 deflates a ZIP archive's files with libdeflate's compressor, in threads
# a block at a time (zip::Archive::set_deflate_library), reads a tar, cpio or
# XAR archive once into a folder (Options::on_written), and changes a 7z
# archive by writing it again (sevenz::Writer::copy_from). 0.11 opens Debian
# packages down to their data.tar (open::Layer::Deb), reads and extracts
# SquashFS images, in threads (extract_squashfs, Options::threads), for snaps
# and AppImages (hivepack::appimage), with LZO among their compressions.
hivepack = { version = "0.11.0", features = ["rar", "unsafe-fast", "memory"] }
packwing-audit = { path = "crates/audit" }
packwing-core = { path = "crates/core" }
packwing-remote = { path = "crates/remote" }
packwing-i18n = { path = "crates/i18n" }
packwing-license = { path = "crates/license" }
packwing-policy = { path = "crates/policy" }
packwing-sandbox = { path = "crates/sandbox" }
packwing-update = { path = "crates/update" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Dependencies optimised in dev builds too, so the UI is smooth while developing.
[profile.dev.package."*"]
opt-level = 2

